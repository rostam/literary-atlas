<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Literary Atlas</title>
<meta name="description" content="191 book reviews placed where the books are set, and when — a reading history as a map and a timeline.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M2 3h5v11H2z' fill='%230F766E'/><path d='M9 3h5v11H9z' fill='%230F766E' opacity='.55'/><circle cx='4.5' cy='7' r='1.3' fill='%23fff'/><circle cx='11.5' cy='9' r='1.3' fill='%23fff'/></svg>">
<link rel="stylesheet" href="css/plate.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <header class="masthead">
    <h1><span class="mark">◉</span> Literary Atlas</h1>
    <p class="tagline">Where the books are set, not where they were published</p>
    <a href="https://rostam.github.io/labs/">All five</a>
    <a href="https://github.com/rostam/literary-atlas">Source and method</a>
  </header>

  <aside class="rail">
    <div class="group">
      <h2>View</h2>
      <div class="seg" id="mode">
        <button data-v="map" aria-pressed="true">Map</button>
        <button data-v="reach" aria-pressed="false">Reach</button>
      </div>
      <p class="hint" id="modeNote"></p>
    </div>

    <div class="group">
      <h2>Filter</h2>
      <div class="field">
        <label for="minRating">Rated at least <b id="minRatingVal" class="num">1</b>/10</label>
        <input type="range" id="minRating" min="1" max="10" value="1">
      </div>
      <div class="field">
        <label for="era">Set no earlier than <b id="eraVal" class="num">any</b></label>
        <input type="range" id="era" min="-800" max="2000" step="100" value="-800">
      </div>
      <div class="field">
        <label for="q">Title, author or place</label>
        <input type="text" id="q" placeholder="Tolstoy, Tokyo, Barcelona…">
      </div>
      <button id="reset">Clear filters</button>
    </div>

    <div class="group">
      <h2>What is here</h2>
      <dl class="stats" id="stats"></dl>
      <p class="hint" id="unplacedNote"></p>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div class="viewport plate-grid" id="viewport">
      <svg id="canvas" role="img" aria-label="world map of book settings"></svg>
    </div>
    <div class="readout" id="readout"></div>
  </main>
</div>

<aside class="panel" id="panel" hidden></aside>
<script type="module" src="js/app.js"></script>
</body>
</html>
